# device-farmer — the control plane, in Kubernetes.
#
# THE INVARIANT THIS DEPLOYMENT MUST NOT BREAK
#
#   A lease ends when the job says so, when a deadline the user wrote down
#   elapses, or when a human takes it back. Nothing else. Not a socket error,
#   not a probe timeout, not a device going offline, not a pod dying.
#
# Kubernetes is where that invariant is hardest to keep, because eviction,
# drain, preemption and rolling updates are ordinary here. Every knob below
# that looks like a timeout has been chosen so that ordinary cluster churn
# costs a job nothing: farmd never releases a lease on SIGTERM, and the
# replacement pod re-attaches to the same lease at the same fence.
#
# What is NOT in this chart:
#   - Postgres. Bring your own; see Chart.yaml.
#   - `farmd node`. It needs /dev/bus/usb and uhubctl on the physical host the
#     phones are plugged into, so it cannot be a workload here. See README.md.
#   - RBAC and a ServiceAccount. Nothing in this control plane talks to the
#     Kubernetes API; it talks to Postgres. Tokens are not mounted.

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  # One image, every role. The roles disagree about exactly one thing — the
  # lease — and shipping them from one binary makes it impossible to run a
  # reaper built from a different commit than the scheduler it races with.
  repository: ghcr.io/flaviopadilha/device-farmer/farmd
  # Empty means .Chart.AppVersion. Pin a digest or an immutable tag in
  # production: "latest" would let a node restart change the lease semantics
  # of a running farm.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # This chart creates no ServiceAccount and no RBAC, on purpose: farmd never
  # calls the Kubernetes API. Name an existing one only if your cluster policy
  # demands it (image pull secrets, workload identity for a cloud database).
  name: ""
  # Nothing here reads the API server, so no token is projected into any pod.
  automountToken: false

# Applied to every pod in the chart. A control plane that gets preempted
# before the workloads it supervises is a control plane that stops renewing.
priorityClassName: ""

podAnnotations: {}
podLabels: {}

# -----------------------------------------------------------------------------
# Database — the DSN NEVER goes in a ConfigMap.
# -----------------------------------------------------------------------------
database:
  # Set exactly one of dsn or existingSecret. SETTING BOTH IS REFUSED at render
  # time, because existingSecret would win and dsn would be dropped without a
  # word — a control plane pointed at a database nobody chose.
  #
  #   dsn: postgres://farm:secret@postgres.db.svc:5432/device_farmer?sslmode=require
  #
  # With dsn set, the chart writes a Secret. With existingSecret set, the chart
  # writes nothing and reads DATABASE_URL out of the Secret you already have —
  # which is what you want if the DSN is minted by an external-secrets
  # controller or a cloud IAM helper.
  dsn: ""
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# -----------------------------------------------------------------------------
# API authentication
# -----------------------------------------------------------------------------
auth:
  # FARM_API_TOKENS is a comma-separated list of "<token>:<role>[:<subject>[:<tenant>]]",
  # where role is tenant, operator or admin.
  #
  #   tokens: "s3cr3t:operator:ci,readonly:tenant:dash"
  #
  # WITHOUT THIS, THE CONTROL PLANE IS OPEN: every caller is granted the
  # operator role, which can revoke leases, drain hosts and cut power to a USB
  # port that is holding a live job. NOTES.txt says so again, louder, and
  # deploy/helm/README.md explains how to ask the server which authenticator
  # it actually installed — a build that has the token wiring in place refuses
  # to start on a network listener instead of serving open.
  #
  # SETTING THIS *AND* existingSecret IS REFUSED at render time. existingSecret
  # would win and this value would reach no pod, so editing it to revoke a
  # leaked credential would look like a clean upgrade and change nothing.
  tokens: ""
  # Or keep them out of your values file entirely: a Secret with a
  # FARM_API_TOKENS key (override the key with existingSecretKey).
  existingSecret: ""
  existingSecretKey: FARM_API_TOKENS

# -----------------------------------------------------------------------------
# Configuration — everything that is not a credential.
#
# These are the real environment variables from internal/config/config.go and
# the defaults here are that package's defaults. farmd validates them against
# each other at startup and REFUSES to boot on a bad combination, so a typo
# here fails the rollout rather than a tenant's job.
# -----------------------------------------------------------------------------
config:
  # FARM_LOG_LEVEL: debug | info | warn | error
  logLevel: info
  # FARM_SHUTDOWN_GRACE bounds draining of in-flight HTTP requests. It is NOT a
  # deadline to release leases; nothing in farmd releases on shutdown.
  shutdownGrace: 30s

  db:
    # FARM_DB_MAX_CONNS, per pod. Two floors, and the chart treats them
    # differently because their failure modes differ:
    #
    #   2  REFUSED BELOW THIS. The scheduler, the reaper and the janitor each
    #      pin one connection for the life of the process — the session holding their
    #      leader-election advisory lock. With a pool of one, the elected
    #      leader has nothing left to work with: it logs that it took
    #      leadership and then places no job and reclaims no lease, forever,
    #      with no error anywhere. farmd accepts 1 because internal/config
    #      cannot know which role it is configuring. This chart can.
    #
    #   7  WARNED BELOW THIS, in NOTES.txt. A jobrunner replica runs 4 jobs at
    #      once (jobrunner.DefaultConcurrency), holds one connection
    #      permanently for its claim session, and renews one lease per running
    #      job. Below 7 it warns at startup and then quietly stops picking work
    #      up once the farm is busy. Raise it with jobrunner concurrency.
    maxConns: 8
    # FARM_DB_CONNECT_TIMEOUT
    connectTimeout: 10s

  lease:
    # FARM_LEASE_TTL — how long a lease survives without a renewal before the
    # suspect sweep marks it. Marking a lease suspect RELEASES NOTHING.
    # farm.jobs.ttl is CHECK-constrained to >= 10 minutes.
    ttl: 15m
    # FARM_LEASE_GRACE — the band after TTL before a suspect lease becomes
    # reclaimable. TTL+grace is the only automatic release deadline in the
    # system that a user did not write down. CHECK-constrained to >= 5 minutes.
    grace: 30m
    # FARM_LEASE_RENEW_INTERVAL — at least three renewal attempts must fit
    # inside one TTL, so a holder survives losing two in a row to a rolling
    # deploy or a Postgres failover.
    renewInterval: 90s
    # FARM_LEASE_WITNESS_INTERVAL — on-device proof that the holder is alive.
    # Must land at least twice per grace band or it protects nothing.
    witnessInterval: 2m
    # FARM_LEASE_WITNESS_MAX_EXTENSIONS — caps consecutive witness-only
    # extensions, so a wedged holder cannot keep a phone forever.
    maxWitnessExtensions: 12
    # FARM_SLOT_REARM — how long a slot stays parked after a release or a
    # reclaim. THIS ONE IS LOAD BEARING: it must exceed
    # node.selfFenceTimeout + node.fenceSafetyMargin, or a reclaimed device can
    # be handed to a new job while the previous holder's ADB sockets are still
    # open on the host. farmd refuses to start if you get this wrong.
    slotRearm: 35s

  reaper:
    # FARM_REAPER_INTERVAL — sweep period.
    interval: 10s
    # FARM_REAPER_BATCH — leases considered per sweep.
    batch: 100
    # FARM_REAPER_GAP_FLOOR — a heartbeat older than this counts as a
    # control-plane outage and refunds the lease time it cost.
    gapFloor: 60s
    # FARM_HEARTBEAT_INTERVAL — must be less than half of gapFloor, or
    # ordinary scheduling jitter is recorded as an outage.
    heartbeatInterval: 5s
    # FARM_REAPER_COMPONENTS — the components whose downtime is refunded.
    #
    # Every role ON THE LEASE RENEWAL PATH belongs here and nothing else, and
    # internal/config REFUSES to start a process whose own component is on that
    # path but missing from this list. A blind spot here is not cosmetic:
    # farm.reaper_arm takes min(beat_at) over the components it is given, a
    # component with no row is simply absent from that minimum, and its outage
    # is therefore invisible to gap accounting — BLOCKER 8 in
    # migrations/00002_lease.sql.
    #
    # api, scheduler and reaper: if one of them is down, holders cannot renew
    # and the outage must not be charged to the tenant.
    #
    # jobrunner: it HOLDS the leases whose deadlines the reaper enforces, so a
    # jobrunner outage is precisely the outage this refund exists for. Note
    # this is one name more than farm.reaper_arm's own SQL default of
    # ('reaper','api','scheduler') — that default is only reachable from a
    # hand-typed psql call; every farmd process passes this list explicitly.
    #
    # watchdog, recovery, janitor, chargepolicy, node and enroll beat too and
    # stay ABSENT. They are on the HEALTH side of the firewall this system keeps
    # between its clocks: listing the watchdog would let a device's health move a
    # lease deadline, which is the fusion the whole design exists to prevent.
    # This is no longer only advice. farmd REFUSES TO START — every role, not
    # just the reaper — if one of those names appears here, under its own
    # spelling or its per-host key ("watchdog:h01"), because farm.reaper_arm ADDS
    # a watched component's downtime to expires_at and reclaimable_at of every
    # held and suspect lease. A watchdog outage would otherwise extend every live
    # lease in the farm by its own length.
    #
    # The refusal covers the names farmd knows it beats under. A health component
    # RENAMED with FARM_COMPONENT is caught only on the pod that carries the
    # rename — which in this chart is every pod, since they share this ConfigMap,
    # but a hand-edited manifest that sets the variable on the reaper alone would
    # start. Review a name here that you do not recognise.
    #
    # This is what a farm RUNS, not what it could run. A component that beat
    # once and was then scaled to zero leaves a stale row that refunds every
    # second since it left, to every live lease, on every arm — so remove a
    # name here when you remove it from the farm, and delete its heartbeat row.
    components: "reaper,api,scheduler,jobrunner"

  node:
    # FARM_NODE_SELF_FENCE_TIMEOUT — the host-side fence proxy's staleness
    # budget: how old its last successful read of the host's fence floors may
    # be and still admit a NEW connection. It tears nothing down; a live
    # connection ends only on a fencing fact. It is consumed by `farmd node`
    # on the bare-metal host, so set it to the same value there and here:
    # lease.slotRearm is validated against it in every process.
    selfFenceTimeout: 20s
    # FARM_FENCE_SAFETY_MARGIN — required slack between the two.
    fenceSafetyMargin: 5s

  # FARM_WATCHDOG_INTERVAL — device health probe period. Health never ends a
  # lease; this clock only writes to the health tables.
  watchdogInterval: 5s

  # FARM_MIGRATIONS_TABLE — goose's version table, and the table the API's
  # capability probe reads the applied schema version out of.
  #
  # A schema-qualified value is created if it is missing, because goose writes
  # this table before the first migration runs and on a new database nothing
  # else has made room for it yet; the migrate Job logs the schema it created.
  # Check that line after a change here: a typo makes a schema nobody meant and
  # starts a second, empty ledger in it, and every later run then agrees the
  # database is at version 0. On a database that has already been migrated, a
  # ledger that does not exist is refused instead of created, so the Job fails
  # loudly rather than replaying the whole set into tables that are there.
  migrationsTable: public.goose_db_version

  # FARM_API_URL — how `farmd ctl` and in-cluster clients reach the API.
  # Empty means the api Service of this release.
  apiBaseURL: ""

  # Anything else you need in every pod's environment. FARM_COMPONENT is
  # rejected here on purpose: each role must beat under its own name, and a
  # shared FARM_COMPONENT would make the reaper's gap accounting blind to the
  # role that is actually down.
  extra: {}

# -----------------------------------------------------------------------------
# Artifacts — APKs, pushed files, captured output.
# -----------------------------------------------------------------------------
artifacts:
  # FARM_ARTIFACT_DIR. The distroless image runs with a read-only root
  # filesystem, so this path is always a mounted volume.
  dir: /var/lib/device-farmer/artifacts
  persistence:
    # WITHOUT A SHARED VOLUME, the store is per-pod: the api accepts an upload
    # into its own emptyDir and a jobrunner on another node cannot find the
    # blob when the job's install step asks for it. Fine for a single-replica
    # evaluation; give it a ReadWriteMany claim for anything real.
    enabled: false
    existingClaim: ""

# -----------------------------------------------------------------------------
# Schema migration — a pre-install/pre-upgrade hook.
# -----------------------------------------------------------------------------
migrate:
  enabled: true
  # Hook weights. The hook Secret carrying the DSN is -10, the Job is -5, so
  # the credential exists before the Job that needs it.
  hookWeight: -5
  # A failed migration must stop the rollout: Helm aborts the release and no
  # workload is ever pointed at a schema it does not understand. The failed
  # Job and its pod are kept so `kubectl logs` still has something to show;
  # the next attempt deletes them before creating its own.
  backoffLimit: 1
  # Overall deadline for the run, passed to `farmd migrate -timeout`.
  timeout: 10m
  # How long to wait for the migration advisory lock. Two farmd migrate Jobs
  # racing in one cluster serialise on it rather than both trying to
  # CREATE SCHEMA farm.
  lockTimeout: 2m
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# -----------------------------------------------------------------------------
# api — the tenant HTTP surface, the dashboard, and /metrics.
# -----------------------------------------------------------------------------
api:
  replicaCount: 2
  # Spread replicas over nodes so one node's failure does not take the whole
  # renewal path with it. Set false and use topologySpreadConstraints for
  # anything more specific (zones, racks).
  spreadAcrossNodes: true
  topologySpreadConstraints: []

  service:
    type: ClusterIP
    port: 8080
    # nodePort: 30080
    annotations: {}
    labels: {}
    # sessionAffinity pins one client to one api pod. Empty leaves Kubernetes
    # at "None"; the only other value is "ClientIP".
    #
    # It exists for the dashboard's event stream. EventSource cannot send a
    # header, so the page authenticates it with a single-use ticket minted by a
    # separate request, and the ticket lives in the memory of the replica that
    # minted it (internal/api/stream_ticket.go). With replicaCount above 1 the
    # two requests can land on different pods; the page notices and mints
    # again, so the cost is a retry, not an outage.
    #
    # Off by default because the cure is usually worse. ClientIP affinity is
    # keyed on the source address the Service sees, and behind an ingress
    # controller that is the ingress pods — a handful of addresses, which pins
    # nearly all API traffic onto as few api pods, including the renewal path
    # that must never queue behind a dashboard query. Turn it on when clients
    # reach this Service directly.
    sessionAffinity: ""

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: device-farmer.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  podDisruptionBudget:
    # The API serves POST /api/v1/leases/{id}/renew, the only request in this
    # system whose failure costs a device. A node drain must not be able to
    # take every replica at once.
    enabled: true
    # With replicaCount 1 this allows ZERO voluntary disruptions and blocks
    # every node drain forever. NOTES.txt says so when that is what you asked
    # for. Leases survive an API outage, so prefer maxUnavailable: 1 over
    # blocking the drain if you really want a single replica.
    minAvailable: 1
    # maxUnavailable: 1

  # SIGTERM DRAINS; IT DOES NOT RELEASE. This window only has to outlast
  # config.shutdownGrace so in-flight requests — including a renewal one round
  # trip from succeeding — finish before the kernel kills the process.
  #
  # The chart REFUSES to render if it does not exceed config.shutdownGrace:
  # the kubelet would SIGKILL the api mid-drain, and the request most likely to
  # be in flight during a rolling deploy is a renewal. It costs the holder TTL
  # rather than the device — no lease ends from a failed renewal — but it is a
  # cost nobody chose.
  terminationGracePeriodSeconds: 60

  # The lame-duck window: how long the pod keeps answering AFTER Kubernetes has
  # decided to remove it and BEFORE farmd is signalled.
  #
  # Endpoint removal and the SIGTERM are concurrent, not ordered. The kubelet
  # signals the container while kube-proxy, the ingress and everything else
  # watching the EndpointSlice are still learning the pod is gone, and farmd
  # closes its listener as soon as it is signalled — so requests that were
  # already on their way are answered with a connection reset. It ends no lease
  # (a failed renewal ends nothing) but it makes every deploy cost some holder a
  # retry, once per replica, for no reason.
  #
  # This is NOT a second drain. config.shutdownGrace is what bounds draining,
  # and it starts after this pause finishes. Keep this to single-digit seconds —
  # long enough for the removal to propagate, and no longer — and note that it
  # is spent out of api.terminationGracePeriodSeconds, which the chart REFUSES
  # to render unless it exceeds this plus config.shutdownGrace.
  #
  # It renders lifecycle.preStop.sleep, which needs Kubernetes 1.29 or newer
  # (GA in 1.30). An older API server drops the field and shutdown behaves as it
  # did before this option existed; there is no fallback, because the image is
  # distroless and has no shell for an exec handler to run. 0 disables it.
  preStopSleepSeconds: 5

  probes:
    liveness:
      # /healthz answers from process state and NEVER touches the database.
      # That is the point: a Postgres outage must not restart the API. A
      # restart loses in-flight renewals and resets the heartbeat that the
      # reaper's gap accounting depends on — which is how a database blip
      # would turn into mass reclamation.
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      # /readyz pings the database. An instance that cannot reach Postgres
      # cannot serve a renewal, so it should leave the Service — and come back
      # by itself when the database does.
      enabled: true
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      enabled: true
      periodSeconds: 2
      failureThreshold: 30

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# scheduler — matches queued jobs to free devices via farm.lease_acquire.
# -----------------------------------------------------------------------------
scheduler:
  # One is enough. Every replica takes a Postgres session advisory lock and
  # only the winner allocates; the rest idle and keep beating. Raise this for
  # a warm standby that takes over in milliseconds instead of on a pod
  # reschedule — allocation is never duplicated, only the lock holder acts.
  #
  # There is no PodDisruptionBudget for this role, nor for any of the other
  # single-replica ones, and that is a decision rather than an omission: at one
  # replica minAvailable 1 forbids every voluntary disruption in the cluster
  # forever, and maxUnavailable 1 permits exactly the eviction it would be
  # asked to prevent. Neither is a budget; they are decoration. What protects
  # an elected singleton is being rescheduled promptly — and, for the reaper,
  # farm.reaper_arm refunding the gap it was blind for before it sweeps again.
  replicaCount: 1
  terminationGracePeriodSeconds: 60

  # A startupProbe on the metrics port, and deliberately no livenessProbe:
  # templates/reaper.yaml carries the argument, and templates/_probes.tpl
  # carries the mechanics. In short — /healthz on FARM_METRICS_ADDR is real
  # (every long-running role serves it) but it answers from a goroutine that
  # knows nothing about the loop, so it is the wrong thing to restart a role
  # over; a startupProbe is never evaluated again once it passes, so all it can
  # do is refuse to call a boot finished that never reached the listener.
  #
  # The chart drops the probe by itself when FARM_METRICS_ADDR is overridden in
  # config.extra or in this role's extraEnv, because a probe aimed at a port
  # nobody bound is a crash loop.
  startupProbe:
    enabled: true
    # 60 seconds. The listener is bound after the configuration preflight and
    # the first database connection, and that connection is already bounded by
    # config.db.connectTimeout (10s) — a role that cannot reach Postgres exits
    # on its own rather than waiting here.
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# reaper — the suspect sweep and the ONLY automatic release path.
# -----------------------------------------------------------------------------
reaper:
  # Same advisory-lock election as the scheduler. A second replica idles
  # rather than duplicating reclaims, and on every gain of leadership the
  # winner calls farm.reaper_arm BEFORE its first sweep, so a reaper that was
  # just blind refunds the outage instead of mass-revoking at the moment of
  # restoration.
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  # See scheduler.startupProbe. This is the role the argument was written for:
  # a livenessProbe here would restart the only automatic release path in the
  # system over a metrics bind that cmd/farmd survives on purpose.
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# janitor — closes the rows whose process died. It can never end a lease.
# -----------------------------------------------------------------------------
janitor:
  # Same advisory-lock election as the scheduler and the reaper: a second
  # replica idles and keeps beating. One is the right number — orphans are
  # produced by crashes, not by throughput — and a warm standby is harmless.
  # Deliberately absent from config.reaper.components: this role is not on
  # the lease renewal path, so its downtime refunds nothing to a lease.
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  # See scheduler.startupProbe.
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# recovery — the recovery ladder. Acts FOR a holder that keeps its device.
# -----------------------------------------------------------------------------
recovery:
  # Serialised per device by a transaction-scoped advisory lock rather than by
  # a single-writer election, so a second replica is harmless; one is still
  # the right number, because the ladder is rate limited by cooldowns and not
  # by throughput.
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  # See scheduler.startupProbe.
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# jobrunner — turns a lease into work actually happening on a phone.
# -----------------------------------------------------------------------------
jobrunner:
  # This one scales. Jobs are claimed with SELECT ... FOR UPDATE SKIP LOCKED
  # plus a session advisory lock per job, and a lease is re-attached by
  # job_id, so two replicas never fight over one device: the loser simply does
  # not see the row.
  replicaCount: 2
  spreadAcrossNodes: true
  topologySpreadConstraints: []
  # Longer than the others on purpose. A jobrunner pod is holding leases and
  # driving phones; give its in-flight step time to finish reporting before
  # the process goes away. It still releases nothing on the way out — the
  # replacement re-attaches by job_id at the same fence.
  #
  # This number is a comfort, NOT a correctness boundary, and nothing should
  # ever be built on top of it as though it were one. If SIGKILL arrives
  # mid-unwind the cost is an attempt row left open for the janitor and a
  # marker file left on the phone; releasing is reached only on the branch
  # that carries a release reason, and an abandoned run does not take it. Set
  # this to 10 out of a stateless-service habit and you degrade the logs, not
  # the invariant.
  terminationGracePeriodSeconds: 120

  podDisruptionBudget:
    # The one non-api workload with replicas to protect. The rolling-update
    # strategy above covers a DEPLOY and says nothing about a drain: two
    # `kubectl drain`s in quick succession, or a node-image upgrade walking the
    # fleet, can take every runner within seconds of each other. No lease ends
    # when that happens — an abandoned run releases nothing and the replacement
    # re-attaches by job_id at the same fence — but every job in flight stalls
    # until something claims it again, and the tenant pays that stall out of
    # its own TTL.
    enabled: true
    # maxUnavailable, never minAvailable: at replicaCount 1 a minAvailable of 1
    # blocks every node drain in the cluster forever, which is a far worse
    # trade than the re-attach it would be preventing. (NOTES.txt says the same
    # thing about the api's budget, which is minAvailable because the api's
    # failure costs a renewal rather than a re-attach.)
    maxUnavailable: 1

  # See scheduler.startupProbe. No livenessProbe here for the additional reason
  # that a restart taken while a step was mid-flight would abandon work that
  # was fine.
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# watchdog — device health, one Deployment per host.
# -----------------------------------------------------------------------------
watchdog:
  enabled: true
  # Only used when hosts[] is empty: one pod that supervises every row in
  # farm.hosts instead of one pod per host. It is the laptop shape — every
  # host's probes share one process, and hosts enrolled after it started are
  # not watched until it restarts. Fine while bringing a farm up; move the
  # hosts into hosts[] before it matters.
  superviseAllHosts: false
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# The hosts that have phones plugged into them.
#
# Health is per-host because the ADB server is per-host: one stream, one epoch,
# one blast radius. So there is one watchdog per entry below, each pinned to
# its host with FARM_HOST_ID and FARM_ADB_ENDPOINT.
#
# id must match farm.hosts.id — the value `farmd node` registers on that
# machine — and must be a DNS-1123 label, because it becomes part of a resource
# name. farm.hosts.id is unconstrained text in the schema, so an id that is
# perfectly legal in the database and illegal in Kubernetes is ordinary. Ids
# are checked, and checked for uniqueness, whatever watchdog.enabled says: the
# Services in templates/hosts.yaml are built from the same value.
#
# adbEndpoint must be routable FROM THE CLUSTER. The ADB server binds
# 127.0.0.1 by default; start it with `adb -a nodaemon server` on the host.
#
# service.enabled renders a selector-less Service plus an EndpointSlice for the
# bare-metal address, so the endpoint has a stable in-cluster name instead of
# an IP that changes when the machine is re-imaged. service.address is the bare
# address of the machine, with no port and no scheme — the port goes in
# service.port, and anything else is refused, because this value becomes an
# EndpointSlice address or an ExternalName and neither accepts one.
#
# hosts:
#   - id: h01
#     adbEndpoint: device-farmer-h01-adb:5037
#     service:
#       enabled: true
#       address: 10.20.0.11
#       port: 5037
#   - id: h02
#     adbEndpoint: 10.20.0.12:5037
#
# With the fence proxy on (fenceProxy below), a host's adbEndpoint and
# service.port name the PROXY port — FARM_FENCE_LISTEN on that host, default
# 5038 — not 5037. The node agent advertises the proxy as
# farm.hosts.adb_endpoint, and the watchdog pinned to the host must dial the
# same thing it does:
#
#   - id: h01
#     adbEndpoint: device-farmer-h01-adb:5038
#     service:
#       enabled: true
#       address: 10.20.0.11
#       port: 5038
hosts: []

# -----------------------------------------------------------------------------
# U10 — the fence proxy, cluster side.
#
# The proxy itself runs ON each device host, inside `farmd node`, and is turned
# on there by FARM_FENCE_TLS_CERT/KEY/CA in that machine's node.env (see
# docs/design/fence-proxy.md, "Status: integrated on the host"). Nothing in
# this chart serves it. What the chart holds is the material the CLUSTER needs
# to reach a proxied host, in one Secret with the three conventional keys:
#
#   ca.crt    the farm CA that signed the hosts' server certificates; it is
#             what verifies a proxy is the host it claims to be
#   tls.crt   this cluster's client certificate. Its farm://<class>/<service>
#             URI SAN is the class the proxy holds it to — farm://lease/... for
#             a jobrunner, farm://maintenance/... for the watchdog and the
#             recovery ladder (design document, section 9)
#   tls.key   its private key
#
# The Secret is rendered by templates/hosts.yaml (or an existingSecret is
# named) and mounted into every farmd pod through extraVolumes and
# extraVolumeMounts at the bottom of this file, which is the one mechanism all
# the pods in this chart share for material like this. Three shapes are
# REFUSED AT RENDER TIME (_helpers.tpl, checkFence), because each renders
# cleanly and leaves a farm that looks fenced: one or two of ca/cert/key;
# material given while enabled is false, or inline PEMs next to an
# existingSecret; and enabled with no extraVolumes/extraVolumeMounts pair that
# puts THIS Secret at mountPath — a Secret nobody mounts is credentials that
# reach no pod while looking configured.
#
# Which environment variables make the clients read those files is the client
# half's contract and is not decided here. Until it lands, the files are in
# place and unread; the host half — the proxy, the FenceSource, the advertised
# endpoint — is complete without them.
# -----------------------------------------------------------------------------
fenceProxy:
  enabled: false
  # Inline PEMs, rendered into a Secret named <release>-fence (type
  # kubernetes.io/tls, keys ca.crt/tls.crt/tls.key). Leave all three empty and
  # set existingSecret to bring your own with the same three keys.
  ca: ""
  cert: ""
  key: ""
  existingSecret: ""
  # Where the three files land in every pod. Mount the Secret here:
  #
  #   extraVolumes:
  #     - name: fence
  #       secret:
  #         secretName: farm-device-farmer-fence   # or your existingSecret
  #   extraVolumeMounts:
  #     - name: fence
  #       mountPath: /etc/device-farmer/fence
  #       readOnly: true
  mountPath: /etc/device-farmer/fence

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
# A headless Service across every role, for scraping only. It carries no
# traffic: FARM_METRICS_ADDR is set in the ConfigMap, every role binds it, and
# this is what lets something reach them. Turning it off leaves the listeners
# running and unscraped, which is the state that made the api publish every
# other role's counters at a permanent 0.
metricsService:
  enabled: true
  port: 9090
  labels: {}
  annotations: {}

serviceMonitor:
  # Requires the Prometheus Operator CRDs. Scrapes the headless metrics Service,
  # which covers EVERY role — one target per pod, each series labelled with the
  # role that produced it. See the comment in templates/servicemonitor.yaml.
  # Needs metricsService.enabled.
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []

# -----------------------------------------------------------------------------
# Alerting rules.
#
# Also requires the Prometheus Operator CRDs, and gated separately from
# serviceMonitor so a cluster that scrapes device-farmer some other way can take
# the rules without the ServiceMonitor, and a cluster with neither CRD still
# installs the chart.
#
# READ templates/prometheusrule.yaml BEFORE ENABLING. It documents which farmd
# role publishes each series these rules read, and every one of those roles has
# to be SCRAPED before the page over it can fire. That is satisfied by
# serviceMonitor.enabled, or by an equivalent scrape config of your own reaching
# the metrics Service; enabling these rules without one ships pages that return
# no data, never fire, and read as coverage. DeviceFarmerAlertingBlind exists to
# say so out loud rather than let the silence pass for good news, and
# docs/runbooks/alerting-blind.md is what to do about it.
# -----------------------------------------------------------------------------
prometheusRule:
  enabled: false
  namespace: ""
  # Extra labels on the PrometheusRule object. Most Prometheus Operator
  # installations select rule objects by label — kube-prometheus-stack's default
  # is `release: <its release name>` — and a PrometheusRule that no Prometheus
  # selects is a file in the cluster that alerts nobody.
  labels: {}
  annotations: {}

  # Where the runbook_url annotations point. The runbooks live in docs/runbooks
  # in this repository; point this at your own copy if you fork them, or at a
  # wiki. Every alert names a file that exists there.
  runbookBaseURL: https://github.com/flaviopadilha/device-farmer/blob/main/docs/runbooks

  # The `job` label DeviceFarmerAPIDown matches on. Setting it replaces the
  # rule's whole target selector with job="<value>".
  #
  # Empty is not one fixed answer, because the label depends on what is doing
  # the scraping. The Prometheus Operator's default job label is the SERVICE's
  # name: with serviceMonitor.enabled the chart scrapes the headless metrics
  # Service — every role through one Service — so the job is that Service's name
  # and the api is picked out of it by role="api"; with the ServiceMonitor off,
  # a scrape config of your own is pointed at the api Service and its name is
  # the answer. The rule renders whichever of the two this release is in.
  #
  # A WRONG value here makes DeviceFarmerAPIDown fire permanently rather than go
  # quiet, which is deliberate: absent() announces a selector that matches
  # nothing instead of disarming the rule in silence.
  apiJob: ""

  # Rules over the per-role metrics (farm_reaper_*, farm_scheduler_*,
  # farm_jobrunner_*). OFF, because enabling a page is your decision and not a
  # chart default.
  #
  # The two things that once made it unsafe are both fixed: cmd/farmd registers
  # every package's Collectors() in every role, and every role binds
  # FARM_METRICS_ADDR, which serviceMonitor scrapes one target per pod. So turn
  # this on once you have confirmed your Prometheus is actually scraping the
  # metrics Service — enabling it while nothing scrapes those pods ships rules
  # that return no data and therefore never fire, which reads as coverage and
  # is not. DeviceFarmerAlertingBlind is the rule that says so out loud.
  roleScrape: false

  thresholds:
    # How often the rules are evaluated. Independent of serviceMonitor.interval;
    # evaluating faster than you scrape just re-reads the same sample.
    evaluationInterval: 1m

    # DeviceFarmerProtectedLeaseSuspect. Long enough that a supervisor restarting
    # across a rolling deploy heals itself first — a heartbeat inside the grace
    # band clears suspect at the same fence — and short enough that a job waiting
    # on a human is not waiting all night.
    protectedSuspectFor: 5m

    # DeviceFarmerLeaseReclaimed / DeviceFarmerLeaseFenced. Both fire on any
    # increase at all, so these windows only control how long the alert stays up
    # and how much is summarised in one page, not whether it fires.
    lostWorkWindow: 15m
    fenceWindow: 10m

    # DeviceFarmerLeaseRenewalsFailing, the in-progress form of
    # DeviceFarmerLeaseReclaimed. The rule fires only while NOT ONE renewal has
    # landed on a replica that is attempting them, so neither number is a
    # sensitivity dial — together they decide how long an outage must last
    # before it is worth a ticket. ADD THEM UP before changing either: the
    # `unless` arm cannot go true until the whole window has drained of
    # successes, so the earliest this can fire is renewalWindow +
    # renewalsFailingFor after the last renewal that landed. 10 minutes, as
    # shipped.
    #
    # That sum is the only number that matters, and it has to stay under the
    # budget a lease has left. Worst case is the schema's own floors —
    # FARM_LEASE_TTL 10m and FARM_LEASE_GRACE 5m, below which farm.jobs' CHECK
    # refuses the job — so 15 minutes from the last landed renewal to
    # reclamation, before the control-plane gap refund and any witness extend
    # it. At this chart's defaults (15m + 30m) it is 45. Ten leaves room in
    # both, which is the whole point of the rule: it has to arrive while the
    # leases can still be saved, not alongside the page that says they were
    # not.
    #
    # renewalWindow must also stay several renewal intervals wide
    # (config.lease.renewInterval, 90s above) or one slow renewal reads as a
    # replica with no successes at all. Four intervals, here. renewalsFailingFor
    # then rides out a Postgres failover on top of that.
    renewalWindow: 6m
    renewalsFailingFor: 4m

    # DeviceFarmerAPIDown. Two scrape intervals plus slack, so a rolling deploy
    # of the api does not page.
    apiDownFor: 5m

    # DeviceFarmerAPIAuthOpen. Not a blip — the value is decided once at process
    # construction — so this only has to outlast a rollout.
    authOpenFor: 10m

    # DeviceFarmerControlPlaneGap. farm.reaper_arm records a gap on gain of
    # leadership, so this window has to be wide enough to catch one that landed
    # between evaluations.
    gapWindow: 30m
    # DeviceFarmerControlPlaneGapBudget, in seconds of refunded lease deadline
    # per hour. 600 is ten minutes of control-plane downtime added back to every
    # live lease in an hour: survivable once, a pattern worth a ticket.
    gapBudgetSeconds: 600

    # DeviceFarmerHubDown and DeviceFarmerHubDegraded. hubMinDevices is a strict
    # `>`, so 1 means "more than one device on this hub": a single dead phone is
    # the recovery ladder's problem, not a page. It also excludes the
    # all-"unknown" seed series, whose device total is 0.
    hubMinDevices: 1
    # Long: a whole hub can legitimately go dark for a minute while devices
    # reboot under their own tests, and a hub that is genuinely gone will still
    # be gone in ten minutes.
    hubDownFor: 10m
    hubDegradedFor: 15m
    # Which farm.device_runtime.health values count as "unhealthy together".
    # A regex; the ten legal values are in internal/obs/metrics.go. 'recovering'
    # is excluded on purpose — the ladder is already working on it — and so is
    # 'booting', which is a device doing what it was asked to do.
    hubUnhealthyStates: offline|unauthorized|missing|degraded
    hubUnhealthyRatio: 0.5

    # DeviceFarmerDevicesQuarantined (fleet) and DeviceFarmerHubQuarantined
    # (one hub). Both strict `>`. Scale the fleet number with the fleet: it is
    # capacity that will not come back until a human closes each quarantine.
    quarantinedDevices: 3
    quarantinedPerHub: 2
    quarantinedFor: 15m

    # The recovery ladder. Windows are long because these count deliberate,
    # rate-limited actions — the ladder's own per-tier cooldowns cap a device at
    # a handful of attempts an hour — so a short window would need a threshold
    # of 1 to ever fire.
    recoveryWindow: 1h
    recoveryPolicyWindow: 6h
    refusedGanged: 3
    refusedPolicy: 5
    recoveryFailures: 5
    # Which obs tiers count for DeviceFarmerRecoveryFailing. NOT the full set:
    # internal/recovery folds no_change onto obs's "failed", and observe,
    # quarantine and host_drain all return no_change when they SUCCEED. Adding
    # 'reprobe' or 'quarantine' here turns this rule into a permanent false
    # alarm — see the comment above the recovery group in
    # templates/prometheusrule.yaml.
    recoveryActionTiers: adb_reconnect|soft_reset|port_power_cycle

    # DeviceFarmerAlertingBlind. An hour, because the legitimate false alarm is
    # a farm that has been installed but has no devices enrolled yet, and an
    # hour is long enough for the first enrollment cycle and short enough that a
    # genuinely blind farm is found the same day.
    blindFor: 1h

    # DeviceFarmerJobsFailing, in the roles group. A fraction of all attempt
    # outcomes, not a rate, so it does not fire on a quiet farm where two
    # failures are 100% of the traffic.
    jobFailureRatio: 0.25

# -----------------------------------------------------------------------------
# Pod hardening. The image is distroless/static:nonroot — no shell, no package
# manager, nothing to exec into at 3am instead of fixing the image.
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Extra volumes and mounts for every farmd pod, e.g. a CA bundle for a
# sslmode=verify-full DSN.
extraVolumes: []
extraVolumeMounts: []

# -----------------------------------------------------------------------------
# chargepolicy — holds idle devices inside a charge band. It can never end a
# lease: it acts only on devices with no live lease, and it does not import
# the lease package. See templates/chargepolicy.yaml.
# -----------------------------------------------------------------------------
chargepolicy:
  # Same advisory-lock election as the scheduler and the reaper: a second
  # replica idles as a warm standby rather than telling the agents two stories
  # about one port.
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  band:
    # FARM_CHARGE_MIN_PCT — a held device is released at or below this.
    minPct: 40
    # FARM_CHARGE_MAX_PCT — an idle device above this is parked and its port
    # held dark. 40–80% is the band the lithium research behind HW-03 points
    # at: a cell at 80% stores materially less energy than one at 100%.
    maxPct: 80
    # FARM_CHARGE_INTERVAL — loop period. Every held gate is re-asserted once
    # per interval for a hold of two intervals, so one missed cycle costs
    # nothing and two hand the port back to the agent's dead-man's switch.
    # farmd refuses anything above half the agent's 30m hold cap.
    interval: 2m
  # See scheduler.startupProbe.
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # FARM_NODE_TOKEN goes here, from a Secret — the same token the `farmd node`
  # agents were started with. Without it the loop runs but holds nothing, and
  # says so under farm_chargepolicy_skipped_total{reason="no_client"}.
  #
  #   - name: FARM_NODE_TOKEN
  #     valueFrom:
  #       secretKeyRef:
  #         name: device-farmer-node
  #         key: FARM_NODE_TOKEN
  extraEnv: []
