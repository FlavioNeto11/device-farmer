{{/*
Everything farmd reads from the environment that is NOT a credential.

The DSN and the API tokens are not here and cannot be put here: a ConfigMap is
readable by anything with get on the namespace, and a Postgres URL is a
password. See templates/secret.yaml.
*/}}
{{/*
Every cross-value assertion runs from here, because this is the one template
that renders in every possible release: there is no combination of enabled
flags that can skip it, and therefore none that can skip a guard.
*/}}
{{- include "device-farmer.validate" . -}}
{{- $forbidden := list "DATABASE_URL" "FARM_API_TOKENS" "FARM_COMPONENT" -}}
{{- range $k, $v := .Values.config.extra -}}
{{- if has $k $forbidden -}}
{{- fail (printf "\ndevice-farmer: config.extra must not set %s.\n\n  DATABASE_URL and FARM_API_TOKENS are credentials; use database.* and auth.*.\n  FARM_COMPONENT is per-role identity: every role writes farm.component_beat\n  under its own name, and one shared name would make the reaper's gap\n  accounting blind to the role that is actually down — the outage would go\n  unrefunded and its leases would be reclaimed on schedule.\n" $k) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "device-farmer.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $) | nindent 4 }}
data:
  FARM_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Drains in-flight requests. Never a deadline to release a lease.
  FARM_SHUTDOWN_GRACE: {{ .Values.config.shutdownGrace | quote }}

  FARM_DB_MAX_CONNS: {{ .Values.config.db.maxConns | quote }}
  FARM_DB_CONNECT_TIMEOUT: {{ .Values.config.db.connectTimeout | quote }}

  # The api role listens here. 0.0.0.0 rather than a loopback default, because
  # a container that binds 127.0.0.1 answers its own probes and nothing else.
  FARM_API_ADDR: "0.0.0.0:{{ .Values.api.service.port }}"
  # These two are parsed and validated by internal/config, and NOTHING BINDS
  # THEM in the roles this chart deploys: /metrics is served on FARM_API_ADDR
  # by the api role, and FARM_NODE_ADDR belongs to `farmd node`, which runs on
  # the bare-metal hosts. They are set so the value is one place if a listener
  # ever appears; do not point a scrape or a NetworkPolicy at :9090 expecting
  # an answer. See the comment in templates/servicemonitor.yaml for what is
  # and is not observable today.
  FARM_METRICS_ADDR: ":9090"
  FARM_NODE_ADDR: ":8082"
  # Where `farmd ctl` — and anything else in the cluster — finds this release.
  FARM_API_URL: {{ include "device-farmer.apiURL" . | quote }}

  # ---- lease liveness. The only clock that may end a lease on a timer. ----
  FARM_LEASE_TTL: {{ .Values.config.lease.ttl | quote }}
  FARM_LEASE_GRACE: {{ .Values.config.lease.grace | quote }}
  FARM_LEASE_RENEW_INTERVAL: {{ .Values.config.lease.renewInterval | quote }}
  FARM_LEASE_WITNESS_INTERVAL: {{ .Values.config.lease.witnessInterval | quote }}
  FARM_LEASE_WITNESS_MAX_EXTENSIONS: {{ .Values.config.lease.maxWitnessExtensions | quote }}
  # Must exceed FARM_NODE_SELF_FENCE_TIMEOUT + FARM_FENCE_SAFETY_MARGIN.
  # farmd asserts this at startup and refuses to run if it does not hold.
  FARM_SLOT_REARM: {{ .Values.config.lease.slotRearm | quote }}

  # ---- the automatic release path, and the outage accounting in front of it ----
  FARM_REAPER_INTERVAL: {{ .Values.config.reaper.interval | quote }}
  FARM_REAPER_BATCH: {{ .Values.config.reaper.batch | quote }}
  FARM_REAPER_GAP_FLOOR: {{ .Values.config.reaper.gapFloor | quote }}
  FARM_HEARTBEAT_INTERVAL: {{ .Values.config.reaper.heartbeatInterval | quote }}
  FARM_REAPER_COMPONENTS: {{ .Values.config.reaper.components | quote }}

  # ---- the host-side fence, mirrored here so the assertion above can be made ----
  FARM_NODE_SELF_FENCE_TIMEOUT: {{ .Values.config.node.selfFenceTimeout | quote }}
  FARM_FENCE_SAFETY_MARGIN: {{ .Values.config.node.fenceSafetyMargin | quote }}

  # ---- device health. Writes health tables; never a lease. ----
  FARM_WATCHDOG_INTERVAL: {{ .Values.config.watchdogInterval | quote }}

  FARM_MIGRATIONS_TABLE: {{ .Values.config.migrationsTable | quote }}
  FARM_ARTIFACT_DIR: {{ .Values.artifacts.dir | quote }}
{{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
