{{/*
reaper — the suspect sweep, and the ONLY automatic release path in the system.

farm.lease_reclaim runs from here and nowhere else. It is guarded by a grace
band, by a control-plane gap refund, and by a quiesce window; none of those
guards exist anywhere else, which is why no other component — and no shutdown
handler, and no probe — is allowed to end a lease.

SINGLE WRITER BY ELECTION, NOT BY REPLICA COUNT. The same Postgres session
advisory lock as the scheduler: a second replica idles rather than duplicating
reclaims, so reaper.replicaCount may be raised for a warm standby. On every
GAIN of leadership the winner calls farm.reaper_arm before its first sweep,
which records the outage it was blind for, refunds that time to every live
lease, and sets a quiesce window derived from the longest TTL it could have
missed. A reaper that has just been restarted therefore does not mass-revoke
at the moment of restoration — which is precisely what makes a rolling update
of this Deployment safe.

FARM_DB_MAX_CONNS must be at least 2: one connection is pinned for the
leadership lock.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "reaper") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "reaper") | nindent 4 }}
spec:
  replicas: {{ .Values.reaper.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "device-farmer.selectorLabels" (dict "ctx" $ "component" "reaper") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "device-farmer.labels" (dict "ctx" $ "component" "reaper") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "device-farmer.configChecksums" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "device-farmer.podPreamble" . | nindent 6 }}
      # SIGTERM drains; it never releases. Note what this means for the one
      # component that CAN release: an evicted reaper stops sweeping, and
      # nothing is reclaimed until a replica gains the lock and arms itself.
      # Leases outliving a dead reaper is the correct failure direction.
      terminationGracePeriodSeconds: {{ .Values.reaper.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.reaper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reaper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reaper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reaper
          image: {{ include "device-farmer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["reaper"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # NO livenessProbe — AND THE REASON IS NOT THAT NOTHING LISTENS.
          #
          # This is the file the other roles point at, so the argument is
          # written out once here. Every long-running role serves GET /metrics
          # and GET /healthz on FARM_METRICS_ADDR (cmd/farmd wraps them in
          # withMetrics), so a livenessProbe against it would render and would
          # pass. It is still wrong, in both directions at once:
          #
          #   - It fires on a fault the binary deliberately survives. A metrics
          #     bind that fails is NOT fatal, and cmd/farmd/roles.go says why in
          #     as many words: a reaper that will not start is the only
          #     automatic release path gone. A livenessProbe on that port turns
          #     that survivable monitoring fault into a CrashLoopBackOff of the
          #     one component that can end a lease at all.
          #   - It proves nothing about the sweep. /healthz is answered from a
          #     separate goroutine on its own mux and touches neither the loop
          #     nor Postgres, so a reaper wedged on a session that never returns
          #     answers 200 for exactly as long as it is wedged. The deadlock
          #     that makes somebody want this probe is the one case it cannot
          #     see.
          #
          # Liveness for this role is farm.component_heartbeat — the dashboard
          # and GET /api/v1/capabilities read it, and with prometheusRule.enabled
          # and prometheusRule.roleScrape on, DeviceFarmerComponentBeatFailing
          # pages on it. "reaper" is in FARM_REAPER_COMPONENTS, so its own
          # downtime is refunded to the leases it would otherwise have reclaimed
          # the moment it came back.
          #
          # The startupProbe below is a different question and is safe for the
          # reason templates/_probes.tpl gives: it is never evaluated again once
          # it passes, so it cannot restart a reaper that is sweeping.
          {{- with (include "device-farmer.startupProbe" (dict "ctx" $ "component" "reaper")) }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            {{- include "device-farmer.envFrom" . | nindent 12 }}
          env:
            {{- include "device-farmer.databaseEnv" (dict "ctx" $) | nindent 12 }}
            {{- with .Values.reaper.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.reaper.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
