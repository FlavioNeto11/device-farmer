# The evaluation database. It is not a farm's database, and it is built so that
# it cannot quietly become one.
#
# THE CHART SHIPS NO POSTGRES, AND THAT DECISION IS NOT BEING REVERSED HERE.
# Chart.yaml argues it: every lease, fence and job in this system lives in that
# database, so a farm whose Postgres arrived as a convenience subchart is one
# `helm uninstall` — or one deleted PVC — away from losing the record of which
# phone is holding whose six-hour job. That argument is about a farm.
#
# A laptop is a different question and deserves its own answer rather than the
# farm's answer inherited by accident. Here there is no record worth keeping:
# the devices are simulated, the jobs are generated by the demo feeder, and the
# whole point of the exercise is to throw it away afterwards. So this file says
# yes to a bundled Postgres and then makes it impossible to mistake for a real
# one:
#
#   - the storage is an emptyDir. Not a PVC with a small size that somebody
#     could "just increase", not a StorageClass that could be swapped for a
#     good one — a directory that dies with the pod, so there is no upgrade
#     path from this file to a farm's database and nobody can be halfway
#     along one without noticing.
#   - the credentials are farm/farm, in plaintext, in a public repository.
#   - the name says it. `kubectl get pods` reads `evaluation-postgres`, and so
#     does the DSN in deploy/helm/local-values.yaml.
#
# What a farm does instead is in deploy/helm/README.md: bring your own
# Postgres, with backups, and point database.dsn or database.existingSecret at
# it.
apiVersion: v1
kind: Service
metadata:
  name: evaluation-postgres
  labels:
    app.kubernetes.io/name: evaluation-postgres
    app.kubernetes.io/part-of: device-farmer-local
    app.kubernetes.io/managed-by: k8s-up.sh
  annotations:
    device-farmer.io/evaluation-only: >-
      Storage is an emptyDir and dies with the pod. Nothing in this database
      survives a restart, and nothing in it is meant to.
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: evaluation-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-postgres
  labels:
    app.kubernetes.io/name: evaluation-postgres
    app.kubernetes.io/part-of: device-farmer-local
    app.kubernetes.io/managed-by: k8s-up.sh
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. A rolling update would run two Postgres pods
    # for a moment, each with its own empty data directory, and the api behind
    # the Service would see whichever one the endpoint list happened to name —
    # a schema that exists on one connection and not the next. On an emptyDir
    # there is nothing to hand over, so the honest shape is: stop, then start.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-postgres
        app.kubernetes.io/part-of: device-farmer-local
    spec:
      containers:
        - name: postgres
          # The same image docker-compose.yml runs, so the schema is exercised
          # against one PostgreSQL major on both local paths.
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: farm
            - name: POSTGRES_PASSWORD
              value: farm
            - name: POSTGRES_DB
              value: device_farmer
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            # pg_isready against the database farmd will actually open, not
            # just the port. The chart's migration hook is a pre-install hook:
            # if it starts before Postgres is accepting connections it fails
            # the install, and helm's message names the Job rather than the
            # cause. scripts/k8s-up.sh waits on this probe before it calls
            # helm at all.
            exec:
              command: ["pg_isready", "-U", "farm", "-d", "device_farmer", "-q"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "farm", "-d", "device_farmer", "-q"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          # See the header. This is the whole reason this file is safe to ship:
          # there is no volume here to outlive the evaluation.
          emptyDir: {}
