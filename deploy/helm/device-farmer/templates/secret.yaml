{{- include "device-farmer.requireDatabase" . -}}
{{- if not .Values.database.existingSecret }}
{{/*
The DSN. A Postgres URL carries a password, so it lives here and nowhere else;
templates/configmap.yaml refuses the key outright.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "device-farmer.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.dsn | quote }}
{{- end }}

{{- if and .Values.auth.tokens (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "device-farmer.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
type: Opaque
stringData:
  # "<token>:<role>[:<subject>[:<tenant>]]", comma separated. operator and
  # admin can revoke a lease and cut power to a port that is holding a live
  # job; hand those out accordingly.
  FARM_API_TOKENS: {{ .Values.auth.tokens | quote }}
{{- end }}

{{- if and .Values.migrate.enabled (not .Values.database.existingSecret) }}
---
{{/*
The same DSN again, for the migration hook only.

Helm applies pre-install hooks BEFORE the ordinary release manifest, so on a
first install the Secret above does not exist yet when the migrate Job runs.
Rather than annotate the release's own Secret as a hook — which would orphan a
credential on uninstall — the hook gets a copy of its own at a lower weight,
and Helm deletes it as soon as the migration succeeds.

hook-failed is on the list too, and only on this Secret. The Job deliberately
keeps its failed pod so `kubectl logs` still has the goose output, but a copy
of the DSN has no diagnostic value and Helm does not own it once the release is
aborted: without hook-failed a failed first install leaves a plaintext database
password sitting in the namespace, belonging to no release, surviving
`helm uninstall`. The Job is terminal by the time Helm applies this, so nothing
still needs the credential.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-migrate" (include "device-farmer.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.dsn | quote }}
{{- end }}
