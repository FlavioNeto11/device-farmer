{{- if .Values.serviceMonitor.enabled }}
{{/*
Prometheus Operator scrape config for the api Service.

WHAT THIS COVERS: everything the api process exposes on /metrics — request
rates and latencies, the lease protocol counters it serves, and the Go runtime.
It is served on the same port as the API itself, unauthenticated, for the same
reason /healthz is: an operator debugging a farm whose auth is the broken thing
still needs to see its state. If that port is reachable from outside the
cluster, put the scrape behind a NetworkPolicy rather than behind a token.

WHAT THIS DOES NOT COVER: the roles that serve no HTTP. scheduler, reaper,
recovery, jobrunner and watchdog register their collectors in-process and
nothing listens, so their metrics — including the reaper's leader gauge, whose
sum across replicas must be exactly 1 — are not scrapeable from here today.
Their liveness is observable instead through the API: GET
/api/v1/capabilities reports every component that has ever written
farm.component_heartbeat, with how long ago. Alert on that until the non-api
roles serve FARM_METRICS_ADDR.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
  namespace: {{ default .Release.Namespace .Values.serviceMonitor.namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "device-farmer.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
