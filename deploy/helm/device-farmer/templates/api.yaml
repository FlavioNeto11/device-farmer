{{/*
api — the tenant HTTP surface, the operator dashboard, and /metrics.

This is the only role in the chart that listens on a port, and the only one
that serves POST /api/v1/leases/{id}/renew: the one request in this system
whose failure costs a device. Everything below exists to keep that request
answerable during ordinary cluster churn.
*/}}
{{/*
The lame-duck pause is spent OUT OF the drain window, not beside it.

_helpers.tpl's checkDrainWindow refuses a terminationGracePeriodSeconds that
does not exceed config.shutdownGrace. api.preStopSleepSeconds runs before farmd
is signalled at all, and the kubelet counts it against the same grace period, so
a window that passed that check can still leave the drain short. This covers the
range checkDrainWindow cannot see — a window larger than the drain and no larger
than the drain plus the pause in front of it — and the two conditions are
disjoint, so exactly one of them can ever fire.
*/}}
{{- $grace := include "device-farmer.durationSeconds" .Values.config.shutdownGrace -}}
{{- if $grace -}}
{{- $window := .Values.api.terminationGracePeriodSeconds | int -}}
{{- $lame := .Values.api.preStopSleepSeconds | int -}}
{{- if and (gt $window ($grace | int)) (le $window (add ($grace | int) $lame)) -}}
{{- fail (printf "\ndevice-farmer: the api's lame-duck pause eats the drain it exists to protect.\n\n  api.terminationGracePeriodSeconds = %d seconds\n  api.preStopSleepSeconds           = %d seconds, spent BEFORE farmd is signalled\n  config.shutdownGrace              = %s (%d seconds)\n\nThe kubelet counts the preStop pause against the termination grace period, so\nfarmd would be left %d seconds to drain and SIGKILLed with requests still open.\nOn a rolling deploy the one most likely to be open is\nPOST /api/v1/leases/{id}/renew, a round trip from success: no lease ends from\nlosing it, but the holder pays TTL for a deploy that should have cost nothing.\n\nRaise api.terminationGracePeriodSeconds above %d, or lower api.preStopSleepSeconds\nor config.shutdownGrace.\n" $window $lame .Values.config.shutdownGrace ($grace | int) (sub $window $lame) (add ($grace | int) $lame)) -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take the API below its current size to deploy. A holder that
      # cannot renew keeps its lease — the lease does not end on a failed
      # renewal — but it burns TTL it did not have to.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "device-farmer.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "device-farmer.configChecksums" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "device-farmer.podPreamble" . | nindent 6 }}
      # SIGTERM MUST NOT RELEASE LEASES.
      #
      # farmd treats a signal as "stop accepting new work and finish what is in
      # flight". It does not release, and no configuration here can make it:
      # a pod eviction is not evidence that the job on the phone died. In
      # Kubernetes a SIGTERM is the most ordinary event there is — a node
      # drain, a rolling update, a spot preemption — and a control plane that
      # "cleaned up after itself" on the way out would turn all of them into
      # destroyed work. That is DeviceFarmer/STF issue #663 with a cluster
      # trigger instead of a socket one.
      #
      # This window therefore only has to outlast FARM_SHUTDOWN_GRACE, so that
      # in-flight requests — including a renewal one round trip from success —
      # finish before the kernel kills the process.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.api.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.api.spreadAcrossNodes }}
      topologySpreadConstraints:
        {{- include "device-farmer.spread" (dict "ctx" $ "component" "api") | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "device-farmer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          {{- if gt (int .Values.api.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              # THE LAME-DUCK WINDOW, and it is not a second drain: farmd has
              # not been signalled yet while this runs, so nothing is draining
              # and nothing is being released.
              #
              # Endpoint removal is asynchronous with the SIGTERM. The kubelet
              # signals the container while kube-proxy, the ingress and every
              # other reader of the EndpointSlice are still being told this pod
              # is gone — and farmd closes its listener the moment it is
              # signalled, so a request that arrives inside that gap is met
              # with a reset instead of a 200. A renewal answered that way ends
              # no lease, but it costs the holder a retry on every deploy, once
              # per replica, which is a bill nobody chose to pay.
              #
              # sleep, not exec: the image is distroless and has no shell to
              # run one in. The field is Kubernetes 1.29 and newer (GA in
              # 1.30); an older API server prunes it and the shutdown behaves
              # exactly as it did before this existed.
              sleep:
                seconds: {{ .Values.api.preStopSleepSeconds }}
          {{- end }}
          envFrom:
            {{- include "device-farmer.envFrom" . | nindent 12 }}
          env:
            {{- include "device-farmer.databaseEnv" (dict "ctx" $) | nindent 12 }}
            {{- with (include "device-farmer.authEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if and .Values.fenceProxy.enabled .Values.fenceProxy.controlCert .Values.fenceProxy.controlKey }}
            # The control-class certificate, and it is here rather than in the
            # ConfigMap because only the api presents this class. Every other
            # role dials maintenance and has no use for a credential it would
            # never offer — giving it to all of them would put a class that can
            # drive a phone on eight processes that never should.
            #
            # The CA is the shared one from the ConfigMap: it is the same proxy
            # being verified.
            - name: FARM_FENCE_CONTROL_CERT
              value: {{ printf "%s/control.crt" .Values.fenceProxy.mountPath | quote }}
            - name: FARM_FENCE_CONTROL_KEY
              value: {{ printf "%s/control.key" .Values.fenceProxy.mountPath | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.api.probes.liveness.enabled }}
          livenessProbe:
            # /healthz answers from process state and NEVER touches the
            # database. That is deliberate: restarting the API because
            # Postgres blinked would lose every in-flight renewal and reset
            # the component heartbeat the reaper's gap accounting depends on,
            # which is how a database hiccup turns into mass reclamation.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.api.probes.readiness.enabled }}
          readinessProbe:
            # /readyz pings the database with a short deadline. An instance
            # that cannot reach Postgres cannot serve a renewal, so it leaves
            # the Service — and rejoins by itself, without a restart, when the
            # database comes back.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.api.probes.startup.enabled }}
          startupProbe:
            # Slow first start (a cold database, a busy node) is not a crash.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "device-farmer.artifactVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "device-farmer.artifactVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
    {{- with .Values.api.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  {{- with .Values.api.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "device-farmer.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
{{/*
A voluntary disruption — a node drain, a cluster upgrade — must not be allowed
to take the whole renewal path at once. Leases survive an API outage (they go
suspect, and farm.reaper_arm refunds the gap on recovery), but "survives" is
not "should be made to".
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  {{- if .Values.api.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.api.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "device-farmer.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.ingress.enabled }}
---
{{/*
Anything that terminates TLS in front of this must NOT impose a response
timeout shorter than a long poll: GET /api/v1/stream is a Server-Sent Events
response the dashboard holds open, and the API sets no write timeout on
purpose so a renewal is never cut off mid-flight.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-farmer.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "device-farmer.componentName" (dict "ctx" $ "component" "api") }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
